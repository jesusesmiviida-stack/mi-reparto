<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparto Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-20">

    <header class="glass-header px-6 py-4 mb-4">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="L" class="w-10 h-10 rounded-full bg-slate-100 object-cover border border-slate-100">
                <div>
                    <h1 class="font-extrabold text-slate-900 text-lg tracking-tight">Ruta de Hoy</h1>
                    <div id="gps-indicator" class="flex items-center gap-1.5">
                        <div id="gps-dot" class="w-2 h-2 bg-slate-300 rounded-full"></div>
                        <p id="gps-text" class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Esperando GPS</p>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <p id="status" class="text-xs font-bold text-slate-900">0/0</p>
                <div class="w-16 bg-slate-100 h-1 rounded-full mt-1 overflow-hidden">
                    <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-5">
        <div id="lista-entregas" class="space-y-3"></div>

        <button onclick="reiniciarRuta()" class="w-full mt-12 py-4 bg-slate-50 text-slate-400 rounded-2xl font-bold text-xs tracking-widest hover:bg-slate-100 transition-colors">
            REINICIAR JORNADA
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
