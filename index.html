<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparto Hub Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-10">

    <header class="header-app px-6 py-4 mb-4">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="app-logo">
                <div>
                    <h1 class="font-bold text-slate-900 text-lg leading-tight">Ruta de Hoy</h1>
                    <div id="gps-indicator" class="flex items-center gap-1.5">
                        <div id="gps-dot" class="w-2 h-2 bg-slate-300 rounded-full"></div>
                        <p id="gps-text" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Buscando GPS</p>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <p id="status" class="text-sm font-black text-blue-600">0/0</p>
                <div class="progress-container mt-1">
                    <div id="progress-bar" class="progress-fill"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4">
        <div id="lista-entregas"></div>

        <button onclick="reiniciarRuta()" class="btn-restart">
            REINICIAR JORNADA
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
