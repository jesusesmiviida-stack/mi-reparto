<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reparto - Pro</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-md mx-auto">
        <header class="flex flex-col items-center mb-6 text-center">
            <img src="logo.png" alt="Logo" class="w-24 h-24 rounded-full shadow-lg mb-4 border-4 border-white object-cover">
            
            <div id="gps-indicator" class="flex items-center gap-2 mb-4 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-200">
                <span id="gps-dot" class="w-2.5 h-2.5 bg-gray-400 rounded-full transition-colors duration-500"></span>
                <span id="gps-text" class="text-[10px] font-bold text-gray-500 tracking-widest uppercase">Buscando Señal</span>
            </div>

            <div class="w-full bg-white rounded-full h-4 shadow-inner border border-slate-200 overflow-hidden mb-2">
                <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-500 shadow-[0_0_10px_rgba(37,99,235,0.4)]"></div>
            </div>
            <div id="status" class="text-xs font-black text-slate-500 tracking-tighter uppercase">Cargando...</div>
        </header>
        
        <div id="lista-entregas" class="space-y-3"></div>

        <button onclick="reiniciarRuta()" class="w-full mt-10 mb-8 py-4 bg-slate-800 text-white rounded-2xl font-black shadow-lg active:scale-95 transition-all border-b-4 border-slate-950">
            REINICIAR RUTA PARA MAÑANA
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
</html>
