<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reparto - Pro</title>
    <link rel="icon" type="image/png" href="logo.png.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="max-w-md mx-auto">
        <header class="flex flex-col items-center mb-6 text-center">
            <img src="logo.png.png" alt="Logo" class="w-24 h-24 rounded-full shadow-2xl mb-4 border-4 border-white object-cover">
            
            <div id="gps-indicator" class="glass flex items-center gap-2 mb-4 px-4 py-1.5 rounded-full shadow-sm">
                <span id="gps-dot" class="w-2.5 h-2.5 bg-gray-400 rounded-full transition-colors duration-500"></span>
                <span id="gps-text" class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">Buscando Señal</span>
            </div>

            <div class="w-full bg-slate-200/50 backdrop-blur-sm rounded-full h-4 shadow-inner border border-white/40 overflow-hidden mb-2">
                <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-700 shadow-[0_0_15px_rgba(37,99,235,0.5)]"></div>
            </div>
            <div id="status" class="text-[10px] font-black text-slate-400 tracking-widest uppercase">Cargando Datos...</div>
        </header>
        
        <div id="lista-entregas" class="space-y-4"></div>

        <button onclick="reiniciarRuta()" class="w-full mt-12 mb-10 py-4 bg-slate-900 text-white rounded-2xl font-black shadow-2xl active:scale-95 transition-all border-b-4 border-black uppercase tracking-widest text-sm">
            Reiniciar Ruta para Mañana
        </button>

        <footer class="text-center pb-6">
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest opacity-60">Sistema de Reparto v2.0</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
