<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparto Pro v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            background-attachment: fixed;
        }

        /* Tarjetas con estilo moderno */
        .cliente-card {
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Efecto de cristal esmerilado real */
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* Botón de WhatsApp con gradiente */
        .btn-wa {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
        }

        /* Botón de Maps con gradiente */
        .btn-maps {
            background: linear-gradient(135deg, #4285F4 0%, #34a853 100%);
        }

        /* Animación de entrada */
        .fade-in {
            animation: slideUp 0.4s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="pb-10">
    <div class="glass-header p-4 mb-6 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-12 h-12 rounded-xl shadow-md border-2 border-white object-cover bg-white">
                <div>
                    <h1 class="font-black text-slate-800 leading-none text-lg uppercase tracking-tight">Logística</h1>
                    <div id="gps-indicator" class="flex items-center gap-1.5 mt-1">
                        <span id="gps-dot" class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span id="gps-text" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Iniciando GPS...</span>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <div id="status" class="text-[10px] font-black text-blue-600 uppercase">Cargando...</div>
                <div class="w-24 bg-slate-200 rounded-full h-1.5 mt-1 overflow-hidden">
                    <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-1000"></div>
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4">
        <div id="lista-entregas" class="space-y-4"></div>

        <button onclick="reiniciarRuta()" class="w-full mt-12 mb-8 py-5 bg-slate-900 text-white rounded-2xl font-black shadow-xl active:scale-95 transition-all uppercase tracking-widest text-xs flex items-center justify-center gap-2">
            <span>🔄</span> REINICIAR JORNADA
        </button>

        <p class="text-center text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] pb-10">
            Smart Delivery System v2.0
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
