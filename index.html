<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reparto</title>
    <link rel="icon" type="image/png" href="logo.png.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-md mx-auto">
        
        <header class="flex flex-col items-center mb-6">
            <img src="logo.png.png" alt="Logo" class="w-24 h-24 rounded-full shadow-lg mb-4 border-4 border-white object-cover">
            <div id="status" class="text-sm font-bold text-slate-600"></div>
        </header>
        
        <div id="lista-entregas" class="space-y-3"></div>

        <button onclick="reiniciarRuta()" class="w-full mt-10 mb-8 py-4 bg-slate-800 text-white rounded-2xl font-black shadow-lg active:scale-95 transition-transform">
            REINICIAR RUTA PARA MAÑANA
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
