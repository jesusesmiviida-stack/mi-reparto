<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística Pro - Sistema de Reparto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-10">

    <header class="glass-header p-4 mb-6 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="logo.png.png" alt="Logo" class="w-12 h-12 rounded-xl shadow-md border-2 border-white object-cover bg-slate-100">
                <div>
                    <h1 class="font-extrabold text-slate-900 leading-none text-lg tracking-tight uppercase">Mi Reparto</h1>
                    <div id="gps-indicator" class="flex items-center gap-1.5 mt-1">
                        <span id="gps-dot" class="w-2 h-2 bg-gray-400 rounded-full transition-colors"></span>
                        <span id="gps-text" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Iniciando GPS...</span>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <div id="status" class="text-[10px] font-black text-blue-600 uppercase tracking-tighter text-right">0 / 0 COMPLETADOS</div>
                <div class="w-24 bg-slate-200 rounded-full h-1.5 mt-1 overflow-hidden ml-auto">
                    <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-1000"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4">
        <div id="lista-entregas" class="space-y-4"></div>

        <button onclick="reiniciarRuta()" class="w-full mt-10 mb-6 py-5 bg-slate-900 text-white rounded-2xl font-bold shadow-xl active:scale-95 transition-all text-xs tracking-[0.2em] flex items-center justify-center gap-2 uppercase">
            🔄 Reiniciar Jornada
        </button>

        <p class="text-center text-[9px] text-slate-400 font-bold uppercase tracking-[0.3em] opacity-50">
            Professional Delivery v2.0
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
